
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatsapp - Apple Glass</title>
    <style>
        /* 🍎 iPhone Style Premium Mesh Background */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100dvh; 
            overflow: hidden; 
            background-color: #000000;
            background-image: 
                radial-gradient(at 0% 0%, rgba(74, 0, 224, 0.6) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(142, 45, 226, 0.6) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 0, 153, 0.4) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(0, 212, 255, 0.4) 0px, transparent 50%);
            background-size: cover;
            color: #ffffff;
        }

        /* 💎 APPLE SECRET GLASS EFFECT (High Blur + Saturation) */
        .apple-glass {
            background: rgba(30, 30, 30, 0.4);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 0.5px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        header { 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 20px; 
            font-weight: 600;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        #status { 
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffcc00; 
            padding: 4px; 
            text-align: center; 
            font-size: 11px; 
            border-radius: 12px;
            margin: 0 15px;
        }

        #chat-window { 
            flex: 1; 
            padding: 20px 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            scroll-behavior: smooth; 
        }
        
        /* iMessage Style Bubbles */
        .message { 
            padding: 12px 16px; 
            border-radius: 22px; 
            max-width: 80%; 
            word-wrap: break-word; 
            position: relative; 
            font-size: 16px; 
            line-height: 1.4;
            color: #fff;
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        
        .message.sent { 
            margin-left: auto; 
            /* Apple iMessage Blue Tint */
            background: rgba(10, 132, 255, 0.35); 
            border-bottom-right-radius: 4px; 
        }
        
        .message.received { 
            margin-right: auto; 
            /* Apple Dark Mode Gray Tint */
            background: rgba(255, 255, 255, 0.15); 
            border-bottom-left-radius: 4px; 
        }

        .message .username { font-weight: 600; font-size: 11px; margin-bottom: 5px; display: block; opacity: 0.7; letter-spacing: 0.3px; }
        .message img { width: 100%; border-radius: 14px; display: block; margin-top: 8px; border: 0.5px solid rgba(255,255,255,0.2); }

        /* Input Area Apple Style */
        #form { 
            display: flex; 
            padding: 12px 15px; 
            gap: 10px; 
            align-items: center; 
            padding-bottom: env(safe-area-inset-bottom, 15px);
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            border-bottom: none;
        }

        #input { 
            flex: 1; 
            padding: 12px 18px; 
            border: 0.5px solid rgba(255,255,255,0.2); 
            background: rgba(0,0,0,0.2); 
            color: white; 
            border-radius: 30px; 
            outline: none; 
            font-size: 16px; 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        #input::placeholder { color: rgba(255,255,255,0.6); }

        .icon-btn { 
            background: rgba(255, 255, 255, 0.15); 
            border: 0.5px solid rgba(255, 255, 255, 0.2); 
            color: white; 
            width: 42px; 
            height: 42px; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 18px; 
            cursor: pointer; 
            flex-shrink: 0; 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: all 0.2s ease;
        }
        .icon-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.3); }
        .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        #record-btn.recording { background: rgba(255, 59, 48, 0.6); border-color: #ff3b30; animation: pulse 1s infinite; }
        #cancel-record-btn { background: rgba(255,59,48,0.4); display: none; }
        #timer-display { display: none; flex: 1; text-align: center; color: #ff3b30; font-weight: 600; font-size: 18px; }
        
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }

        /* Call Buttons & Modal Apple Glass */
        .call-buttons { display: flex; gap: 12px; }
        .header-btn { background: rgba(255, 255, 255, 0.15); border: 0.5px solid rgba(255, 255, 255, 0.2); color: white; border-radius: 50%; font-size: 16px; display: flex; justify-content: center; align-items: center; width: 40px; height: 40px; }
        
        #video-container { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0,0,0,0.6); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; gap: 20px; backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); }
        .video-grid { display: flex; flex-direction: column; gap: 20px; width: 100%; align-items: center; }
        video { width: 90vw; height: 35vh; background: rgba(255,255,255,0.05); border-radius: 24px; object-fit: cover; border: 0.5px solid rgba(255,255,255,0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        #incoming-call-modal { display: none; position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); padding: 30px 25px; border-radius: 28px; z-index: 10000; text-align: center; color: white; width: 80%; max-width: 320px; }
        .call-btn-group { display: flex; justify-content: space-around; margin-top: 25px; }
        .btn-accept { background: rgba(52, 199, 89, 0.4); border: 0.5px solid #34c759; color: white; padding: 12px 25px; border-radius: 30px; font-weight: 600; cursor: pointer; font-size: 15px; }
        .btn-reject { background: rgba(255, 59, 48, 0.4); border: 0.5px solid #ff3b30; color: white; padding: 12px 25px; border-radius: 30px; font-weight: 600; cursor: pointer; font-size: 15px; }
    </style>
</head>
<body>

    <audio id="incoming-ring" loop src="https://assets.mixkit.co/active_storage/sfx/2870/2870-preview.mp3"></audio>
    <audio id="outgoing-ring" loop src="https://assets.mixkit.co/active_storage/sfx/2954/2954-preview.mp3"></audio>

    <header class="apple-glass">
        <span>Chats</span>
        <div class="call-buttons">
            <button class="header-btn apple-glass" id="voice-call-btn" disabled>📞</button>
            <button class="header-btn apple-glass" id="video-call-btn" disabled>📹</button>
        </div>
    </header>
    <div id="status">Connecting...</div>

    <div id="chat-window"></div>

    <div id="incoming-call-modal" class="apple-glass">
        <h3 style="margin: 0 0 10px 0; font-weight: 600;" id="incoming-call-title">📹 Video Call</h3>
        <p style="margin: 0; font-size: 15px; opacity: 0.7;">Someone is calling you...</p>
        <div class="call-btn-group">
            <button class="btn-reject" id="reject-call-btn">Decline</button>
            <button class="btn-accept" id="accept-call-btn">Accept</button>
        </div>
    </div>

    <div id="video-container">
        <h2 id="voice-only-text" style="display: none; color: #fff; margin-bottom: 20px; font-weight: 500;">📞 Voice Call Active</h2>
        <div class="video-grid" id="video-streams">
            <div>
                <p style="text-align:center; font-size:12px; margin:2px; opacity:0.6;">Remote</p>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
            <div>
                <p style="text-align:center; font-size:12px; margin:2px; opacity:0.6;">You</p>
                <video id="localVideo" autoplay muted playsinline></video>
            </div>
        </div>
        <button class="btn-reject apple-glass" id="end-call-btn" style="margin-top: 30px; padding: 15px 40px; font-size: 16px;">End Call</button>
    </div>

    <form id="form" class="apple-glass">
        <button type="button" class="icon-btn" id="img-btn" disabled>📷</button>
        <input id="input" autocomplete="off" placeholder="iMessage..." required disabled />
        <span id="timer-display">00:00</span>
        <button type="button" class="icon-btn" id="cancel-record-btn">🗑️</button>
        <button type="button" class="icon-btn" id="record-btn" disabled>🎤</button>
        <button type="submit" class="icon-btn" id="send-btn" disabled>➤</button>
        <input type="file" id="image-input" accept="image/*" style="display: none;" />
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chatWindow = document.getElementById('chat-window');
        const input = document.getElementById('input');
        const incomingRing = document.getElementById('incoming-ring');
        const outgoingRing = document.getElementById('outgoing-ring');
        
        let username = prompt("Apna naam darj karein:");
        if (!username || username.trim() === "") username = "Guest_" + Math.floor(Math.random() * 1000);

        socket.on('connect', () => {
            document.getElementById('status').style.display = 'none';
            input.disabled = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('record-btn').disabled = false;
            document.getElementById('img-btn').disabled = false;
            document.getElementById('video-call-btn').disabled = false;
            document.getElementById('voice-call-btn').disabled = false;
        });

        function triggerVibration() { if (navigator.vibrate) navigator.vibrate(100); }

        function appendMessage(data, contentHtml, typeLabel = "") {
            const item = document.createElement('div');
            item.className = `message ${data.name === username ? 'sent' : 'received'}`;
            const labelText = typeLabel ? `${data.name} (${typeLabel})` : data.name;
            item.innerHTML = `<span class="username">${labelText}</span>${contentHtml}`;
            chatWindow.appendChild(item);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            triggerVibration(); 
        }

        document.getElementById('form').addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value && socket.connected) {
                socket.emit('chat message', { name: username, text: input.value });
                input.value = '';
            }
        });
        socket.on('chat message', (data) => appendMessage(data, data.text));

        const imageInput = document.getElementById('image-input');
        document.getElementById('img-btn').addEventListener('click', () => imageInput.click());
        imageInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height, max = 800;
                        if (w > h && w > max) { h *= max / w; w = max; } else if (h > max) { w *= max / h; h = max; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        socket.emit('image message', { name: username, image: canvas.toDataURL('image/jpeg', 0.7) });
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });
        socket.on('image message', (data) => appendMessage(data, `<img src="${data.image}">`, "Photo"));

        let mediaRecorder, audioChunks = [], isRecording = false, recordTimer, secondsCount = 0;
        const recordBtn = document.getElementById('record-btn'), cancelBtn = document.getElementById('cancel-record-btn'), timerDisplay = document.getElementById('timer-display'), imgBtn = document.getElementById('img-btn'), sendBtn = document.getElementById('send-btn');

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    mediaRecorder = new MediaRecorder(await navigator.mediaDevices.getUserMedia({ audio: true }));
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        if (audioChunks.length > 0) {
                            const reader = new FileReader();
                            reader.readAsDataURL(new Blob(audioChunks, { type: 'audio/webm' }));
                            reader.onloadend = () => socket.emit('voice message', { name: username, audio: reader.result });
                        }
                    };
                    mediaRecorder.start(); isRecording = true; secondsCount = 0;
                    input.style.display = 'none'; imgBtn.style.display = 'none'; sendBtn.style.display = 'none';
                    timerDisplay.style.display = 'block'; cancelBtn.style.display = 'flex';
                    recordBtn.textContent = '⏹️'; recordBtn.classList.add('recording');
                    timerDisplay.textContent = `00:00`;
                    recordTimer = setInterval(() => {
                        secondsCount++;
                        timerDisplay.textContent = `${Math.floor(secondsCount/60).toString().padStart(2,'0')}:${(secondsCount%60).toString().padStart(2,'0')}`;
                    }, 1000);
                } catch (err) { alert("Mic access denied!"); }
            } else stopRecording(true);
        });

        cancelBtn.addEventListener('click', () => { audioChunks = []; stopRecording(false); });
        function stopRecording() {
            if (mediaRecorder) { mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(t => t.stop()); }
            clearInterval(recordTimer); isRecording = false;
            input.style.display = 'block'; imgBtn.style.display = 'flex'; sendBtn.style.display = 'flex';
            timerDisplay.style.display = 'none'; cancelBtn.style.display = 'none';
            recordBtn.textContent = '🎤'; recordBtn.classList.remove('recording');
        }
        socket.on('voice message', (data) => {
            const audio = document.createElement('audio'); audio.controls = true; audio.src = data.audio; audio.style.width = '100%'; audio.style.marginTop = '8px';
            const item = document.createElement('div'); item.className = `message ${data.name === username ? 'sent' : 'received'}`;
            item.innerHTML = `<span class="username">${data.name} (Voice Note)</span>`; item.appendChild(audio);
            chatWindow.appendChild(item); chatWindow.scrollTop = chatWindow.scrollHeight;
            triggerVibration(); 
        });

        let localStream, remoteStream, peerConnection, pendingOffer = null, isVideoCall = true;
        const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        const videoContainer = document.getElementById('video-container');
        const incomingModal = document.getElementById('incoming-call-modal');
        const videoStreamsUI = document.getElementById('video-streams');
        const voiceOnlyText = document.getElementById('voice-only-text');

        function stopRingtones() {
            incomingRing.pause(); incomingRing.currentTime = 0;
            outgoingRing.pause(); outgoingRing.currentTime = 0;
        }

        document.getElementById('video-call-btn').addEventListener('click', () => startCall(true));
        document.getElementById('voice-call-btn').addEventListener('click', () => startCall(false));

        async function startCall(videoEnabled) {
            isVideoCall = videoEnabled;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: isVideoCall, audio: true });
                setupCallUI(isVideoCall);
                document.getElementById('localVideo').srcObject = localStream;
                videoContainer.style.display = 'flex';
                outgoingRing.play().catch(e=>{}); 
                
                createPeerConnection();
                localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('offer', { sdp: offer, type: isVideoCall ? 'video' : 'voice' });
            } catch (err) { alert("Camera/Mic permission required!"); }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(servers);
            remoteStream = new MediaStream();
            document.getElementById('remoteVideo').srcObject = remoteStream;
            peerConnection.ontrack = (e) => e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));
            peerConnection.onicecandidate = (e) => { if (e.candidate) socket.emit('candidate', e.candidate); };
        }

        function setupCallUI(hasVideo) {
            if(hasVideo) {
                videoStreamsUI.style.display = 'flex';
                voiceOnlyText.style.display = 'none';
            } else {
                videoStreamsUI.style.display = 'none';
                voiceOnlyText.style.display = 'block';
            }
        }

        socket.on('offer', (data) => {
            pendingOffer = data.sdp;
            isVideoCall = data.type === 'video';
            document.getElementById('incoming-call-title').innerText = isVideoCall ? '📹 Video Call' : '📞 Voice Call';
            incomingModal.style.display = 'block';
            incomingRing.play().catch(e=>{}); 
            triggerVibration(); 
        });

        document.getElementById('accept-call-btn').addEventListener('click', async () => {
            incomingModal.style.display = 'none';
            stopRingtones();
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: isVideoCall, audio: true });
                setupCallUI(isVideoCall);
                document.getElementById('localVideo').srcObject = localStream;
                videoContainer.style.display = 'flex';
            } catch (err) { alert("Access needed to answer."); return; }

            createPeerConnection();
            localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
            await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', answer);
            pendingOffer = null;
        });

        document.getElementById('reject-call-btn').addEventListener('click', () => {
            incomingModal.style.display = 'none';
            stopRingtones();
            pendingOffer = null;
            socket.emit('call_rejected'); 
        });

        socket.on('call_rejected', () => {
            stopRingtones();
            alert("Call Declined.");
            forceEndCall();
        });

        socket.on('answer', async (answer) => {
            stopRingtones(); 
            if (peerConnection && !peerConnection.currentRemoteDescription) 
                await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
        });

        socket.on('candidate', async (candidate) => {
            if (peerConnection) try { await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) {}
        });

        document.getElementById('end-call-btn').addEventListener('click', () => {
            forceEndCall();
            socket.emit('end_call'); 
        });

        socket.on('end_call', () => {
            forceEndCall(); 
        });

        function forceEndCall() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (peerConnection) peerConnection.close();
            videoContainer.style.display = 'none';
            incomingModal.style.display = 'none';
            stopRingtones();
            pendingOffer = null;
        }
    </script>
</body>
</html>
