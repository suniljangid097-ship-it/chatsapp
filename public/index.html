<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatsapp</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        #status { background: #fffae6; color: #8a6d3b; padding: 5px; text-align: center; font-size: 12px; border-bottom: 1px solid #f2dede; }
        #chat-window { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: white; padding: 10px 15px; border-radius: 8px; max-width: 60%; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .message .username { font-weight: bold; color: #075e54; font-size: 13px; margin-bottom: 3px; display: block; }
        .message img { max-width: 200px; border-radius: 8px; display: block; margin-top: 5px; }
        #form { display: flex; background: #f0f0f0; padding: 10px; gap: 5px; align-items: center; }
        #input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; outline: none; font-size: 16px; }
        .btn { background: #075e54; color: white; border: none; padding: 10px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; white-space: nowrap; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn:hover:not(:disabled) { background: #128c7e; }
        #record-btn.recording { background: #d9534f; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <header>Chatsapp</header>
    <div id="status">Connecting to server...</div>

    <div id="chat-window"></div>

    <form id="form">
        <input id="input" autocomplete="off" placeholder="Type a message..." required disabled />
        <input type="file" id="image-input" accept="image/*" style="display: none;" />
        <button type="button" class="btn" id="img-btn" disabled>📷 Photo</button>
        <button type="button" class="btn" id="record-btn" disabled>🎤 Voice</button>
        <button type="submit" class="btn" id="send-btn" disabled>Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const statusDiv = document.getElementById('status');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const recordBtn = document.getElementById('record-btn');
        const imgBtn = document.getElementById('img-btn');
        const imageInput = document.getElementById('image-input');
        const chatWindow = document.getElementById('chat-window');

        let username = prompt("Apna naam darj karein (Enter your name):");
        if (!username || username.trim() === "") {
            username = "Guest_" + Math.floor(Math.random() * 1000);
        }

        socket.on('connect', () => {
            statusDiv.style.display = 'none';
            input.disabled = false;
            sendBtn.disabled = false;
            recordBtn.disabled = false;
            imgBtn.disabled = false;
        });

        // 1. Text Message Logic
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (input.value && socket.connected) {
                socket.emit('chat message', { name: username, text: input.value });
                input.value = '';
            }
        });

        socket.on('chat message', function(data) {
            const item = document.createElement('div');
            item.classList.add('message');
            item.innerHTML = `<span class="username">${data.name}</span>${data.text}`;
            chatWindow.appendChild(item);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });

        // 2. Image Sharing Logic
        imgBtn.addEventListener('click', () => imageInput.click());

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onloadend = () => {
                    socket.emit('image message', { name: username, image: reader.result });
                };
            }
        });

        socket.on('image message', function(data) {
            const item = document.createElement('div');
            item.classList.add('message');
            item.innerHTML = `<span class="username">${data.name} (Photo)</span><img src="${data.image}">`;
            chatWindow.appendChild(item);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });

        // 3. Voice Recording Logic
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            socket.emit('voice message', { name: username, audio: reader.result });
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.textContent = "⏹️ Stop";
                    recordBtn.classList.add('recording');
                } catch (err) {
                    alert("Microphone access denied or not supported!");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.textContent = "🎤 Voice";
                recordBtn.classList.remove('recording');
            }
        });

        socket.on('voice message', function(data) {
            const item = document.createElement('div');
            item.classList.add('message');
            
            const audioElement = document.createElement('audio');
            audioElement.controls = true;
            audioElement.src = data.audio;

            item.innerHTML = `<span class="username">${data.name} (Voice Note)</span>`;
            item.appendChild(audioElement);
            chatWindow.appendChild(item);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });
    </script>
</body>
</html>
