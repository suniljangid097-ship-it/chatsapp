<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatsapp - Sukuna Live</title>
    <style>
        /* Background Live Video Styling */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }

        /* Dark tint overlay so chat text is clearly readable over the video */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.55);
            z-index: -1;
        }

        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden;
            background: #000;
        }

        header { 
            background: rgba(7, 94, 84, 0.85); 
            backdrop-filter: blur(6px);
            color: white; 
            padding: 15px; 
            text-align: center; 
            font-size: 20px; 
            font-weight: bold; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        #status { 
            background: rgba(255, 250, 230, 0.9); 
            color: #8a6d3b; 
            padding: 5px; 
            text-align: center; 
            font-size: 12px; 
            border-bottom: 1px solid #f2dede; 
        }

        #chat-window { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        
        /* Message Bubbles with Glassmorphism effect */
        .message { 
            padding: 10px 15px; 
            border-radius: 12px; 
            max-width: 60%; 
            word-wrap: break-word; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            position: relative;
            backdrop-filter: blur(8px);
            animation: rgbGlow 6s infinite alternate;
        }

        .message.sent { 
            margin-left: auto; 
            background: rgba(220, 248, 198, 0.9); 
            color: #000;
            border-top-right-radius: 0; 
        }

        .message.received { 
            margin-right: auto; 
            background: rgba(255, 255, 255, 0.9); 
            color: #000;
            border-top-left-radius: 0; 
        }

        .message .username { font-weight: bold; color: #075e54; font-size: 12px; margin-bottom: 3px; display: block; }
        .message img { max-width: 200px; border-radius: 8px; display: block; margin-top: 5px; }

        @keyframes rgbGlow {
            0% { border-left: 4px solid #ff0000; }
            25% { border-left: 4px solid #00ff00; }
            50% { border-left: 4px solid #0000ff; }
            75% { border-left: 4px solid #ff00ff; }
            100% { border-left: 4px solid #ffff00; }
        }

        #form { 
            display: flex; 
            background: rgba(32, 44, 51, 0.85); 
            backdrop-filter: blur(6px);
            padding: 10px; 
            gap: 5px; 
            align-items: center; 
            box-shadow: 0 -2px 5px rgba(0,0,0,0.3);
        }

        #input { 
            flex: 1; 
            padding: 10px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            background: rgba(42, 57, 66, 0.8); 
            color: white; 
            border-radius: 4px; 
            outline: none; 
            font-size: 16px; 
        }

        #input::placeholder { color: #aaa; }

        .btn { 
            background: #00a884; 
            color: white; 
            border: none; 
            padding: 10px 12px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 13px; 
            white-space: nowrap; 
        }
        .btn:disabled { background: #565e64; cursor: not-allowed; }
        .btn:hover:not(:disabled) { background: #008f72; }
        #record-btn.recording { background: #d9534f; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- Background Live Anime Video -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="sukuna.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>
    <div class="bg-overlay"></div>

    <header>Chatsapp - Sukuna Live</header>
    <div id="status">Connecting to server...</div>

    <div id="chat-window"></div>

    <form id="form">
        <input id="input" autocomplete="off" placeholder="Type a message..." required disabled />
        <input type="file" id="image-input" accept="image/*" style="display: none;" />
        <button type="button" class="btn" id="img-btn" disabled>📷 Photo</button>
        <button type="button" class="btn" id="record-btn" disabled>🎤 Voice</button>
        <button type="submit" class="btn" id="send-btn" disabled>Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const statusDiv = document.getElementById('status');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const recordBtn = document.getElementById('record-btn');
        const imgBtn = document.getElementById('img-btn');
        const imageInput = document.getElementById('image-input');
        const chatWindow = document.getElementById('chat-window');

        let username = prompt("Apna naam darj karein (Enter your name):");
        if (!username || username.trim() === "") {
            username = "Guest_" + Math.floor(Math.random() * 1000);
        }

        socket.on('connect', () => {
            statusDiv.style.display = 'none';
            input.disabled = false;
            sendBtn.disabled = false;
            recordBtn.disabled = false;
            imgBtn.disabled = false;
        });

        function appendMessage(data, contentHtml, typeLabel = "") {
            const item = document.createElement('div');
            item.classList.add('message');
            
            if (data.name === username) {
                item.classList.add('sent');
            } else {
                item.classList.add('received');
            }

            const labelText = typeLabel ? `${data.name} (${typeLabel})` : data.name;
            item.innerHTML = `<span class="username">${labelText}</span>${contentHtml}`;
            
            chatWindow.appendChild(item);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (input.value && socket.connected) {
                socket.emit('chat message', { name: username, text: input.value });
                input.value = '';
            }
        });

        socket.on('chat message', function(data) {
            appendMessage(data, data.text);
        });

        imgBtn.addEventListener('click', () => imageInput.click());

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onloadend = () => {
                    socket.emit('image message', { name: username, image: reader.result });
                };
            }
        });

        socket.on('image message', function(data) {
            const imgHtml = `<img src="${data.image}">`;
            appendMessage(data, imgHtml, "Photo");
        });

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            socket.emit('voice message', { name: username, audio: reader.result });
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.textContent = "⏹️ Stop";
                    recordBtn.classList.add('recording');
                } catch (err) {
                    alert("Microphone access denied or not supported!");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.textContent = "🎤 Voice";
                recordBtn.classList.remove('recording');
            }
        });

        socket.on('voice message', function(data) {
            const audioElement = document.createElement('audio');
            audioElement.controls = true;
            audioElement.src = data.audio;

            const item = document.createElement('div');
            item.classList.add('message');
            
            if (data.name === username) {
                item.classList.add('sent');
            } else {
                item.classList.add('received');
            }

            item.innerHTML = `<span class="username">${data.name} (Voice Note)</span>`;
            item.appendChild(audioElement);
            chatWindow.appendChild(item);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });
    </script>
</body>
</html>
