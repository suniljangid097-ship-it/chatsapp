<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatsapp - Liquid Glass</title>
    <style>
        /* Futuristic Background */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #e1e8ed; }
        header { background: rgba(31, 44, 52, 0.4); backdrop-filter: blur(10px); color: #00ffcc; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 18px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); }
        #status { background: rgba(0,0,0,0.3); color: #ffcc00; padding: 4px; text-align: center; font-size: 11px; }
        #chat-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        
        /* 💎 LIQUID GLASS THEME MESSAGES 💎 */
        .message { 
            padding: 10px 14px; 
            border-radius: 18px; 
            max-width: 85%; 
            word-wrap: break-word; 
            position: relative; 
            font-size: 15px; 
            color: #fff;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .message.sent { 
            margin-left: auto; 
            background: rgba(0, 200, 150, 0.25); 
            border: 1px solid rgba(0, 255, 170, 0.4);
            border-top-right-radius: 4px; 
        }
        .message.received { 
            margin-right: auto; 
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top-left-radius: 4px; 
        }

        .message .username { font-weight: bold; color: #00ffcc; font-size: 11px; margin-bottom: 4px; display: block; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .message img { width: 100%; border-radius: 12px; display: block; margin-top: 5px; border: 1px solid rgba(255,255,255,0.2); }

        #form { display: flex; background: rgba(31, 44, 52, 0.4); backdrop-filter: blur(10px); padding: 8px 10px; gap: 8px; align-items: center; padding-bottom: env(safe-area-inset-bottom, 8px); border-top: 1px solid rgba(255,255,255,0.1); }
        #input { flex: 1; padding: 12px 15px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white; border-radius: 25px; outline: none; font-size: 15px; backdrop-filter: blur(5px); }
        #input::placeholder { color: #aaa; }
        .icon-btn { background: rgba(0, 255, 204, 0.2); border: 1px solid rgba(0, 255, 204, 0.4); color: white; width: 42px; height: 42px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; flex-shrink: 0; backdrop-filter: blur(5px); }
        .icon-btn:disabled { background: rgba(255,255,255,0.05); cursor: not-allowed; opacity: 0.5; border: none; }
        #record-btn.recording { background: rgba(255, 0, 50, 0.4); border-color: red; animation: pulse 1s infinite; }
        #cancel-record-btn { background: rgba(255,0,0,0.3); display: none; }
        #timer-display { display: none; flex: 1; text-align: center; color: #ff3366; font-weight: bold; font-size: 18px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Call Buttons & Layout */
        .call-buttons { display: flex; gap: 10px; }
        .header-btn { background: rgba(0, 255, 204, 0.2); border: 1px solid rgba(0, 255, 204, 0.4); color: white; padding: 8px; border-radius: 50%; font-size: 15px; display: flex; justify-content: center; align-items: center; width: 35px; height: 35px; backdrop-filter: blur(5px); }
        
        #video-container { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0,0,0,0.95); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
        .video-grid { display: flex; flex-direction: column; gap: 15px; width: 100%; align-items: center; }
        video { width: 90vw; height: 35vh; background: #111; border-radius: 20px; object-fit: cover; border: 2px solid rgba(255,255,255,0.1); }
        
        /* Incoming Call Popup */
        #incoming-call-modal { display: none; position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 30, 40, 0.85); backdrop-filter: blur(15px); padding: 25px; border-radius: 20px; z-index: 10000; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; color: white; width: 80%; max-width: 300px; border: 1px solid rgba(0,255,204,0.3); }
        .call-btn-group { display: flex; justify-content: space-around; margin-top: 20px; }
        .btn-accept { background: rgba(0, 255, 100, 0.3); border: 1px solid #00ff66; color: white; padding: 10px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
        .btn-reject { background: rgba(255, 0, 50, 0.3); border: 1px solid #ff0033; color: white; padding: 10px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <audio id="incoming-ring" loop src="https://assets.mixkit.co/active_storage/sfx/2870/2870-preview.mp3"></audio>
    <audio id="outgoing-ring" loop src="https://assets.mixkit.co/active_storage/sfx/2954/2954-preview.mp3"></audio>

    <header>
        <span>Chatsapp</span>
        <div class="call-buttons">
            <button class="header-btn" id="voice-call-btn" disabled>📞</button>
            <button class="header-btn" id="video-call-btn" disabled>📹</button>
        </div>
    </header>
    <div id="status">Connecting...</div>

    <div id="chat-window"></div>

    <div id="incoming-call-modal">
        <h3 style="margin: 0 0 10px 0;" id="incoming-call-title">📹 Video Call</h3>
        <p style="margin: 0; font-size: 14px; color: #00ffcc;">Someone is calling you...</p>
        <div class="call-btn-group">
            <button class="btn-reject" id="reject-call-btn">Decline</button>
            <button class="btn-accept" id="accept-call-btn">Accept</button>
        </div>
    </div>

    <div id="video-container">
        <h2 id="voice-only-text" style="display: none; color: #00ffcc; margin-bottom: 20px;">📞 Voice Call Active</h2>
        <div class="video-grid" id="video-streams">
            <div>
                <p style="text-align:center; font-size:12px; margin:2px;">Remote</p>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
            <div>
                <p style="text-align:center; font-size:12px; margin:2px;">You</p>
                <video id="localVideo" autoplay muted playsinline></video>
            </div>
        </div>
        <button class="btn-reject" id="end-call-btn" style="margin-top: 20px; padding: 15px 40px; font-size: 16px;">End Call</button>
    </div>

    <form id="form">
        <button type="button" class="icon-btn" id="img-btn" disabled>📷</button>
        <input id="input" autocomplete="off" placeholder="Message..." required disabled />
        <span id="timer-display">00:00</span>
        <button type="button" class="icon-btn" id="cancel-record-btn">🗑️</button>
        <button type="button" class="icon-btn" id="record-btn" disabled>🎤</button>
        <button type="submit" class="icon-btn" id="send-btn" disabled>➤</button>
        <input type="file" id="image-input" accept="image/*" style="display: none;" />
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chatWindow = document.getElementById('chat-window');
        const input = document.getElementById('input');
        const incomingRing = document.getElementById('incoming-ring');
        const outgoingRing = document.getElementById('outgoing-ring');
        
        let username = prompt("Apna naam darj karein:");
        if (!username || username.trim() === "") username = "Guest_" + Math.floor(Math.random() * 1000);

        socket.on('connect', () => {
            document.getElementById('status').style.display = 'none';
            input.disabled = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('record-btn').disabled = false;
            document.getElementById('img-btn').disabled = false;
            document.getElementById('video-call-btn').disabled = false;
            document.getElementById('voice-call-btn').disabled = false;
        });

        function triggerVibration() { if (navigator.vibrate) navigator.vibrate(100); }

        function appendMessage(data, contentHtml, typeLabel = "") {
            const item = document.createElement('div');
            item.className = `message ${data.name === username ? 'sent' : 'received'}`;
            const labelText = typeLabel ? `${data.name} (${typeLabel})` : data.name;
            item.innerHTML = `<span class="username">${labelText}</span>${contentHtml}`;
            chatWindow.appendChild(item);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            triggerVibration(); 
        }

        // --- Chat & Media Send Logic ---
        document.getElementById('form').addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value && socket.connected) {
                socket.emit('chat message', { name: username, text: input.value });
                input.value = '';
            }
        });
        socket.on('chat message', (data) => appendMessage(data, data.text));

        const imageInput = document.getElementById('image-input');
        document.getElementById('img-btn').addEventListener('click', () => imageInput.click());
        imageInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height, max = 800;
                        if (w > h && w > max) { h *= max / w; w = max; } else if (h > max) { w *= max / h; h = max; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        socket.emit('image message', { name: username, image: canvas.toDataURL('image/jpeg', 0.7) });
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });
        socket.on('image message', (data) => appendMessage(data, `<img src="${data.image}">`, "Photo"));

        // --- Voice Record Logic ---
        let mediaRecorder, audioChunks = [], isRecording = false, recordTimer, secondsCount = 0;
        const recordBtn = document.getElementById('record-btn'), cancelBtn = document.getElementById('cancel-record-btn'), timerDisplay = document.getElementById('timer-display'), imgBtn = document.getElementById('img-btn'), sendBtn = document.getElementById('send-btn');

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    mediaRecorder = new MediaRecorder(await navigator.mediaDevices.getUserMedia({ audio: true }));
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        if (audioChunks.length > 0) {
                            const reader = new FileReader();
                            reader.readAsDataURL(new Blob(audioChunks, { type: 'audio/webm' }));
                            reader.onloadend = () => socket.emit('voice message', { name: username, audio: reader.result });
                        }
                    };
                    mediaRecorder.start(); isRecording = true; secondsCount = 0;
                    input.style.display = 'none'; imgBtn.style.display = 'none'; sendBtn.style.display = 'none';
                    timerDisplay.style.display = 'block'; cancelBtn.style.display = 'flex';
                    recordBtn.textContent = '⏹️'; recordBtn.classList.add('recording');
                    timerDisplay.textContent = `00:00`;
                    recordTimer = setInterval(() => {
                        secondsCount++;
                        timerDisplay.textContent = `${Math.floor(secondsCount/60).toString().padStart(2,'0')}:${(secondsCount%60).toString().padStart(2,'0')}`;
                    }, 1000);
                } catch (err) { alert("Mic access denied!"); }
            } else stopRecording(true);
        });

        cancelBtn.addEventListener('click', () => { audioChunks = []; stopRecording(false); });
        function stopRecording() {
            if (mediaRecorder) { mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(t => t.stop()); }
            clearInterval(recordTimer); isRecording = false;
            input.style.display = 'block'; imgBtn.style.display = 'flex'; sendBtn.style.display = 'flex';
            timerDisplay.style.display = 'none'; cancelBtn.style.display = 'none';
            recordBtn.textContent = '🎤'; recordBtn.classList.remove('recording');
        }
        socket.on('voice message', (data) => {
            const audio = document.createElement('audio'); audio.controls = true; audio.src = data.audio; audio.style.width = '100%'; audio.style.marginTop = '5px';
            const item = document.createElement('div'); item.className = `message ${data.name === username ? 'sent' : 'received'}`;
            item.innerHTML = `<span class="username">${data.name} (Voice Note)</span>`; item.appendChild(audio);
            chatWindow.appendChild(item); chatWindow.scrollTop = chatWindow.scrollHeight;
            triggerVibration(); 
        });

        // --- 4. ADVANCED CALLING (VIDEO + VOICE + BOTH SIDE HANGUP) ---
        let localStream, remoteStream, peerConnection, pendingOffer = null, isVideoCall = true;
        const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        const videoContainer = document.getElementById('video-container');
        const incomingModal = document.getElementById('incoming-call-modal');
        const videoStreamsUI = document.getElementById('video-streams');
        const voiceOnlyText = document.getElementById('voice-only-text');

        function stopRingtones() {
            incomingRing.pause(); incomingRing.currentTime = 0;
            outgoingRing.pause(); outgoingRing.currentTime = 0;
        }

        // MAKE VIDEO CALL
        document.getElementById('video-call-btn').addEventListener('click', () => startCall(true));
        // MAKE VOICE CALL
        document.getElementById('voice-call-btn').addEventListener('click', () => startCall(false));

        async function startCall(videoEnabled) {
            isVideoCall = videoEnabled;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: isVideoCall, audio: true });
                setupCallUI(isVideoCall);
                document.getElementById('localVideo').srcObject = localStream;
                videoContainer.style.display = 'flex';
                
                outgoingRing.play().catch(e=>console.log("Audio play policy", e)); // Outgoing Ring bajegi
                
                createPeerConnection();
                localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('offer', { sdp: offer, type: isVideoCall ? 'video' : 'voice' });
            } catch (err) { alert("Camera/Mic permission required!"); }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(servers);
            remoteStream = new MediaStream();
            document.getElementById('remoteVideo').srcObject = remoteStream;
            peerConnection.ontrack = (e) => e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));
            peerConnection.onicecandidate = (e) => { if (e.candidate) socket.emit('candidate', e.candidate); };
        }

        function setupCallUI(hasVideo) {
            if(hasVideo) {
                videoStreamsUI.style.display = 'flex';
                voiceOnlyText.style.display = 'none';
            } else {
                videoStreamsUI.style.display = 'none';
                voiceOnlyText.style.display = 'block';
            }
        }

        // RECEIVE CALL
        socket.on('offer', (data) => {
            pendingOffer = data.sdp;
            isVideoCall = data.type === 'video';
            document.getElementById('incoming-call-title').innerText = isVideoCall ? '📹 Video Call' : '📞 Voice Call';
            incomingModal.style.display = 'block';
            incomingRing.play().catch(e=>console.log("Audio block", e)); // Incoming ring bajegi
            triggerVibration(); 
        });

        // ACCEPT CALL
        document.getElementById('accept-call-btn').addEventListener('click', async () => {
            incomingModal.style.display = 'none';
            stopRingtones();
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: isVideoCall, audio: true });
                setupCallUI(isVideoCall);
                document.getElementById('localVideo').srcObject = localStream;
                videoContainer.style.display = 'flex';
            } catch (err) { alert("Access needed to answer."); return; }

            createPeerConnection();
            localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
            await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', answer);
            pendingOffer = null;
        });

        // REJECT CALL
        document.getElementById('reject-call-btn').addEventListener('click', () => {
            incomingModal.style.display = 'none';
            stopRingtones();
            pendingOffer = null;
            socket.emit('call_rejected'); 
        });

        socket.on('call_rejected', () => {
            stopRingtones();
            alert("Call Declined.");
            forceEndCall();
        });

        // CALL ANSWERED
        socket.on('answer', async (answer) => {
            stopRingtones(); // Uthate hi outgoing ring band
            if (peerConnection && !peerConnection.currentRemoteDescription) 
                await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
        });

        socket.on('candidate', async (candidate) => {
            if (peerConnection) try { await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) {}
        });

        // END CALL (Donu side)
        document.getElementById('end-call-btn').addEventListener('click', () => {
            forceEndCall();
            socket.emit('end_call'); // Server ko bol ki aage wale ki call bhi cut kar
        });

        socket.on('end_call', () => {
            forceEndCall(); // Samne wale ne kaat di, teri call band
        });

        function forceEndCall() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (peerConnection) peerConnection.close();
            videoContainer.style.display = 'none';
            incomingModal.style.display = 'none';
            stopRingtones();
            pendingOffer = null;
        }
    </script>
</body>
</html>
