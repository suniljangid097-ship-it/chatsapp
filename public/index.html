<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="/manifest.json">
    <title>Chatsapp - Premium</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; background: linear-gradient(-45deg, #0f172a, #312e81, #1e1b4b, #000000); background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: #ffffff; transition: background 0.5s ease; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* 🎬 Cinematic Splash Screen */
        #splash-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: #000000; z-index: 999999; display: flex; justify-content: center; align-items: center; transition: opacity 0.8s ease-out; }
        .splash-text-container { display: flex; align-items: baseline; justify-content: center; }
        .brand-main { font-size: 42px; font-weight: 700; letter-spacing: -1px; opacity: 0; animation: fadeUpIn 1s forwards; background: linear-gradient(to right, #fff, #a5b4fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: none; }
        .brand-sub { font-size: 42px; font-weight: 300; color: #86868b; margin-left: 10px; letter-spacing: -1px; opacity: 0; animation: slideOutRight 1.5s 0.8s forwards; text-shadow: none; }
        @keyframes fadeUpIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideOutRight { from { opacity: 0; transform: translateX(-40px); clip-path: inset(0 100% 0 0); } to { opacity: 1; transform: translateX(0); clip-path: inset(0 0 0 0); } }

        /* Liquid Glass Default */
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2); }

        /* 🏝️ DYNAMIC ISLAND WIDGET (Top Center) */
        #dynamic-island { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); height: 35px; min-width: 150px; border-radius: 20px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; z-index: 100; cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); overflow: hidden; }
        #dynamic-island.expanded { height: 250px; width: 85%; max-width: 350px; border-radius: 30px; background: rgba(255, 255, 255, 0.15); }
        .island-title { font-size: 14px; font-weight: 600; margin-top: 8px; text-shadow: none; display: flex; align-items: center; gap: 5px; }
        .online-dot { width: 8px; height: 8px; background: #34C759; border-radius: 50%; box-shadow: 0 0 8px #34C759; }
        
        #users-list { display: none; width: 100%; padding: 15px; box-sizing: border-box; overflow-y: auto; text-align: left; text-shadow: none;}
        #dynamic-island.expanded #users-list { display: block; }
        .user-row { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 15px; cursor: pointer; transition: background 0.2s; border-radius: 8px; }
        .user-row:hover { background: rgba(255,255,255,0.2); }
        .user-row.active { background: rgba(0, 122, 255, 0.4); font-weight: bold; }

        header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 10; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        #chat-window { flex: 1; padding: 50px 15px 20px 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        /* Messages & Reactions */
        .message-wrapper { display: flex; flex-direction: column; position: relative; max-width: 80%; }
        .message-wrapper.sent { margin-left: auto; align-items: flex-end; }
        .message-wrapper.received { margin-right: auto; align-items: flex-start; }
        .message { padding: 12px 16px; border-radius: 20px; font-size: 15.5px; line-height: 1.4; position: relative; user-select: none; }
        .sent .message { background: linear-gradient(135deg, #007AFF, #0056b3); color: white; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3); text-shadow: none; }
        .received .message { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); color: #ffffff; border-bottom-left-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.2); }
        .message .username { font-weight: 600; color: rgba(255,255,255,0.8); font-size: 11px; margin-bottom: 4px; display: block; text-transform: uppercase;}
        .reaction { position: absolute; bottom: -10px; right: -5px; background: rgba(255,255,255,0.2); backdrop-filter: blur(5px); border-radius: 50%; padding: 4px; font-size: 14px; border: 1px solid rgba(255,255,255,0.3); display: none; }

        /* Floating Input Dock */
        #typing-indicator { font-size: 12px; color: rgba(255,255,255,0.8); margin: 0 15px 5px 15px; height: 15px; font-style: italic; text-shadow: none;}
        #form-container { padding: 0 15px; padding-bottom: env(safe-area-inset-bottom, 15px); position: relative; }
        #form { display: flex; padding: 8px; gap: 8px; align-items: center; border-radius: 35px; }
        #input { flex: 1; padding: 10px 5px; border: none; background: transparent; color: white; outline: none; font-size: 16px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        
        .icon-btn { background: rgba(255,255,255,0.15); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; flex-shrink: 0; text-shadow: none; }
        .icon-btn:hover { background: rgba(255,255,255,0.3); }
        #send-btn { background: #007AFF; }
        
        /* Emoji Picker Panel */
        #emoji-picker { display: none; position: absolute; bottom: 70px; left: 15px; border-radius: 20px; padding: 10px; display: none; gap: 10px; z-index: 50; }
        .emoji-item { font-size: 24px; cursor: pointer; transition: transform 0.2s; text-shadow: none;}
        .emoji-item:hover { transform: scale(1.3); }

        /* Modals (Name, Settings, Call) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0,0,0,0.4); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 100000; display: flex; justify-content: center; align-items: center; }
        .modal-box { padding: 30px 25px; border-radius: 25px; text-align: center; width: 85%; max-width: 340px; }
        
        #custom-name-input { width: 100%; box-sizing: border-box; padding: 15px; margin: 20px 0; border: 1px solid rgba(255,255,255,0.2); border-radius: 15px; background: rgba(0,0,0,0.2); color: white; font-size: 16px; outline: none; text-align: center; text-shadow: none; }
        #custom-name-submit { background: #007AFF; color: white; border: none; padding: 14px 25px; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3); text-shadow: none; }
        
        .wallpaper-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 20px 0; }
        .wp-option { height: 80px; border-radius: 12px; cursor: pointer; border: 2px solid rgba(255,255,255,0.1); background-size: cover !important; background-position: center !important; }
        
        /* Call Styles */
        #video-container { display: none; position: fixed; top:0; left:0; width:100vw; height:100dvh; background:rgba(0,0,0,0.8); z-index:9999; flex-direction:column; justify-content:center; align-items:center; }
        video { width: 85vw; height: 35vh; background: rgba(0,0,0,0.5); border-radius: 20px; object-fit: cover; border: 1px solid rgba(255,255,255,0.2); margin-bottom: 15px;}
        .header-btn { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 20px; font-size: 13px; font-weight: 600; backdrop-filter: blur(10px); text-shadow: none; cursor:pointer;}
        
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>

    <!-- Sounds (Pop & Swoosh) -->
    <audio id="sound-send" src="https://assets.mixkit.co/active_storage/sfx/232/232-preview.mp3"></audio>
    <audio id="sound-receive" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3"></audio>
    <audio id="ringtone" loop src="https://assets.mixkit.co/active_storage/sfx/2870/2870-preview.mp3"></audio>

    <!-- 🎬 Splash Screen -->
    <div id="splash-screen">
        <div class="splash-text-container">
            <span class="brand-main">Chatsapp</span>
            <span class="brand-sub">easy chat</span>
        </div>
    </div>

    <!-- Liquid Name Setup -->
    <div id="name-modal-overlay" class="modal-overlay">
        <div class="modal-box glass">
            <h2 style="margin: 0 0 5px 0; font-weight: 600;">Welcome</h2>
            <p style="margin: 0; font-size: 15px; color: rgba(255,255,255,0.9);">Enter your name to connect.</p>
            <form id="custom-name-form">
                <input type="text" id="custom-name-input" placeholder="Your Name" required autocomplete="off" />
                <button type="submit" id="custom-name-submit">Continue</button>
            </form>
        </div>
    </div>

    <!-- Wallpaper Settings -->
    <div id="settings-modal-overlay" class="modal-overlay" style="display: none;">
        <div class="modal-box glass">
            <h2 style="margin: 0;">Settings</h2>
            <p style="font-size: 13px; color: rgba(255,255,255,0.9);">Choose Wallpaper</p>
            <div class="wallpaper-grid">
                <div class="wp-option" data-bg="url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400')"></div>
                <div class="wp-option" data-bg="url('https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?q=80&w=400')"></div>
                <div class="wp-option" data-bg="linear-gradient(-45deg, #0f172a, #312e81, #1e1b4b, #000000)"></div>
                <div class="wp-option" data-bg="url('https://images.unsplash.com/photo-1618005192384-a83a8bd57fbe?q=80&w=400')"></div>
                <div class="wp-option" data-bg="url('https://images.unsplash.com/photo-1557672172-298e090bd0f1?q=80&w=400')"></div>
                <div class="wp-option" data-bg="url('https://images.unsplash.com/photo-1505909182942-e2f09aee3e89?q=80&w=400')"></div>
            </div>
            <button id="close-settings" class="header-btn" style="width:100%;">Done</button>
        </div>
    </div>

    <!-- 🏝️ DYNAMIC ISLAND -->
    <div id="dynamic-island" class="glass">
        <div class="island-title"><span class="online-dot"></span> <span id="current-chat-title">Public Chat</span> ▾</div>
        <div id="users-list">
            <div class="user-row active" onclick="setChatTarget('Public')">🌍 Public Chat</div>
            <!-- Online users will inject here -->
        </div>
    </div>

    <header>
        <button id="settings-btn" class="icon-btn" style="width: 35px; height: 35px; font-size: 16px;">⚙️</button>
        <button class="header-btn" id="video-call-btn">📹 Call</button>
    </header>
    
    <div id="chat-window"></div>

    <div id="typing-indicator"></div>

    <!-- Emoji Picker Popup -->
    <div id="emoji-picker" class="glass">
        <span class="emoji-item">😂</span><span class="emoji-item">❤️</span><span class="emoji-item">👍</span>
        <span class="emoji-item">🔥</span><span class="emoji-item">🙏</span><span class="emoji-item">🎉</span>
    </div>

    <div id="form-container">
        <form id="form" class="glass">
            <button type="button" class="icon-btn" id="emoji-btn">😊</button>
            <button type="button" class="icon-btn" id="img-btn">📷</button>
            <input id="input" autocomplete="off" placeholder="iMessage..." required />
            <button type="button" class="icon-btn" id="record-btn">🎙</button>
            <button type="submit" class="icon-btn" id="send-btn">⬆</button>
            <input type="file" id="image-input" accept="image/*" style="display: none;" />
        </form>
    </div>

    <!-- Call Modals -->
    <div id="incoming-call-modal" class="modal-overlay" style="display:none; z-index:100001;">
        <div class="modal-box glass">
            <p>Incoming Video Call...</p>
            <div style="display:flex; justify-content:space-around; margin-top:20px;">
                <button id="reject-call-btn" style="background:#FF3B30; color:white; border:none; padding:10px 20px; border-radius:20px;">Decline</button>
                <button id="accept-call-btn" style="background:#34C759; color:white; border:none; padding:10px 20px; border-radius:20px;">Accept</button>
            </div>
        </div>
    </div>

    <div id="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay muted playsinline></video>
        <button id="end-call-btn" style="background:#FF3B30; color:white; border:none; padding:12px 30px; border-radius:20px; font-size:16px;">End Call</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Splash & Wallpapers
        window.addEventListener('load', () => {
            setTimeout(() => { document.getElementById('splash-screen').style.opacity = '0'; setTimeout(() => document.getElementById('splash-screen').style.display = 'none', 800); }, 3000); 
        });
        const savedBg = localStorage.getItem('chatsapp_bg');
        if(savedBg) { document.body.style.background = savedBg; document.body.style.backgroundSize = 'cover'; document.body.style.backgroundAttachment = 'fixed'; if(!savedBg.includes('gradient')) document.body.style.animation = 'none'; }

        const socket = io();
        let username = "";
        let currentTarget = "Public"; // Default chat
        let messageIdCounter = 0;

        // Audios
        const sendAudio = document.getElementById('sound-send');
        const receiveAudio = document.getElementById('sound-receive');
        
        // 🏝️ Dynamic Island Logic
        const dynamicIsland = document.getElementById('dynamic-island');
        dynamicIsland.addEventListener('click', (e) => {
            if(!e.target.classList.contains('user-row')) {
                dynamicIsland.classList.toggle('expanded');
            }
        });

        function setChatTarget(id, name) {
            currentTarget = id;
            document.getElementById('current-chat-title').textContent = (id === 'Public') ? "Public Chat" : `Chat with ${name}`;
            dynamicIsland.classList.remove('expanded');
            
            // Highlight active row
            document.querySelectorAll('.user-row').forEach(row => row.classList.remove('active'));
            event.target.classList.add('active');
        }

        socket.on('update_users', (users) => {
            const list = document.getElementById('users-list');
            list.innerHTML = `<div class="user-row ${currentTarget==='Public'?'active':''}" onclick="setChatTarget('Public', 'Public Chat')">🌍 Public Chat</div>`;
            for(let id in users) {
                if(users[id] !== username) { // Don't show self
                    list.innerHTML += `<div class="user-row ${currentTarget===id?'active':''}" onclick="setChatTarget('${id}', '${users[id]}')">👤 ${users[id]}</div>`;
                }
            }
        });

        // Name Form
        document.getElementById('custom-name-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('custom-name-input').value.trim();
            if(name) {
                username = name;
                document.getElementById('name-modal-overlay').style.display = 'none';
                socket.emit('user_join', username); // Tell server I joined
            }
        });

        // Emojis & Settings
        document.getElementById('settings-btn').addEventListener('click', () => document.getElementById('settings-modal-overlay').style.display = 'flex');
        document.getElementById('close-settings').addEventListener('click', () => document.getElementById('settings-modal-overlay').style.display = 'none');
        document.querySelectorAll('.wp-option').forEach(opt => {
            opt.addEventListener('click', function() {
                const bg = this.getAttribute('data-bg'); document.body.style.background = bg; localStorage.setItem('chatsapp_bg', bg);
                document.body.style.animation = bg.includes('gradient') ? 'gradientBG 15s ease infinite' : 'none';
            });
        });

        const emojiBtn = document.getElementById('emoji-btn');
        const emojiPicker = document.getElementById('emoji-picker');
        const mainInput = document.getElementById('input');
        emojiBtn.addEventListener('click', () => { emojiPicker.style.display = emojiPicker.style.display === 'flex' ? 'none' : 'flex'; });
        document.querySelectorAll('.emoji-item').forEach(em => {
            em.addEventListener('click', (e) => { mainInput.value += e.target.textContent; emojiPicker.style.display = 'none'; });
        });

        // Typing Indicator
        let typingTimer;
        mainInput.addEventListener('input', () => {
            socket.emit('typing', { name: username });
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => { socket.emit('stop_typing', { name: username }); }, 1500);
        });

        socket.on('typing', (data) => { document.getElementById('typing-indicator').textContent = `${data.name} is typing...`; });
        socket.on('stop_typing', () => { document.getElementById('typing-indicator').textContent = ''; });

        function triggerVibration() { if (navigator.vibrate) navigator.vibrate(40); }

        function appendMessage(data, contentHtml, typeLabel = "") {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${data.name === username ? 'sent' : 'received'}`;
            
            const msgId = 'msg-' + (++messageIdCounter);
            wrapper.id = msgId;
            
            const msgBubble = document.createElement('div');
            msgBubble.className = 'message';
            
            // Double Tap to React (❤️)
            msgBubble.addEventListener('dblclick', () => {
                socket.emit('reaction', { msgId: msgId, emoji: '❤️' });
                triggerVibration();
            });

            const labelText = typeLabel ? `${data.name} (${typeLabel})` : data.name;
            msgBubble.innerHTML = (data.name !== username) ? `<span class="username">${labelText}</span>${contentHtml}` : contentHtml;
            
            const reactionDiv = document.createElement('div');
            reactionDiv.className = 'reaction';
            msgBubble.appendChild(reactionDiv);

            wrapper.appendChild(msgBubble);
            
            // Show Private Tag if applicable
            if(data.to && data.to !== 'Public') {
                const privateTag = document.createElement('div');
                privateTag.style.fontSize = '10px'; privateTag.style.color = 'gold'; privateTag.textContent = '🔒 Private';
                wrapper.appendChild(privateTag);
            }

            document.getElementById('chat-window').appendChild(wrapper);
            document.getElementById('chat-window').scrollTop = document.getElementById('chat-window').scrollHeight;
            
            // Sounds
            if (data.name === username) { sendAudio.play().catch(()=>{}); } 
            else { receiveAudio.play().catch(()=>{}); triggerVibration(); }
        }

        socket.on('reaction', (data) => {
            const wrapper = document.getElementById(data.msgId);
            if(wrapper) {
                const rxDiv = wrapper.querySelector('.reaction');
                rxDiv.textContent = data.emoji;
                rxDiv.style.display = 'block';
            }
        });

        // Sending Text
        document.getElementById('form').addEventListener('submit', (e) => {
            e.preventDefault();
            if (mainInput.value && username) {
                socket.emit('chat message', { name: username, text: mainInput.value, to: currentTarget });
                mainInput.value = '';
                socket.emit('stop_typing', { name: username });
            }
        });
        socket.on('chat message', (data) => appendMessage(data, data.text));

        // Images & Voice (Kept simple)
        const imageInput = document.getElementById('image-input');
        document.getElementById('img-btn').addEventListener('click', () => imageInput.click());
        imageInput.addEventListener('change', (e) => {
            if (e.target.files[0] && username) {
                const r = new FileReader(); r.onload = (ev) => {
                    const img = new Image(); img.onload = () => {
                        const canvas = document.createElement('canvas'); let w = img.width, h = img.height;
                        if(w>800){h*=800/w;w=800;} canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h);
                        socket.emit('image message', { name: username, image: canvas.toDataURL('image/jpeg', 0.7), to: currentTarget });
                    }; img.src = ev.target.result;
                }; r.readAsDataURL(e.target.files[0]);
            }
        });
        socket.on('image message', (data) => appendMessage(data, `<img src="${data.image}">`, "Photo"));

        let mediaRec, chunks = [];
        document.getElementById('record-btn').addEventListener('click', async function() {
            if(!this.classList.contains('recording')) {
                try {
                    mediaRec = new MediaRecorder(await navigator.mediaDevices.getUserMedia({audio:true})); chunks=[];
                    mediaRec.ondataavailable = e => chunks.push(e.data);
                    mediaRec.onstop = () => { if(chunks.length>0){ const r = new FileReader(); r.onloadend = () => socket.emit('voice message', {name:username, audio:r.result, to:currentTarget}); r.readAsDataURL(new Blob(chunks, {type:'audio/webm'})); } };
                    mediaRec.start(); this.classList.add('recording'); this.textContent = '■';
                } catch(e){ alert("Mic error"); }
            } else { mediaRec.stop(); this.classList.remove('recording'); this.textContent = '🎙'; }
        });
        socket.on('voice message', (data) => {
            const a = document.createElement('audio'); a.controls=true; a.src=data.audio; a.style.width='100%';
            appendMessage(data, a.outerHTML, "Audio");
        });

        // WebRTC Video Call (Same logic)
        let localStream, peerConn, pendingOffer = null;
        document.getElementById('video-call-btn').addEventListener('click', async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
                document.getElementById('localVideo').srcObject = localStream; document.getElementById('video-container').style.display = 'flex';
                peerConn = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
                localStream.getTracks().forEach(t => peerConn.addTrack(t, localStream));
                peerConn.ontrack = e => { document.getElementById('remoteVideo').srcObject = e.streams[0]; };
                peerConn.onicecandidate = e => { if(e.candidate) socket.emit('candidate', e.candidate); };
                const offer = await peerConn.createOffer(); await peerConn.setLocalDescription(offer); socket.emit('offer', offer);
            } catch(e){ alert("Cam/Mic error"); }
        });
        socket.on('offer', o => { pendingOffer=o; document.getElementById('incoming-call-modal').style.display='flex'; document.getElementById('ringtone').play().catch(()=>{}); });
        document.getElementById('accept-call-btn').addEventListener('click', async () => {
            document.getElementById('incoming-call-modal').style.display='none'; document.getElementById('ringtone').pause();
            localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true}); document.getElementById('localVideo').srcObject = localStream; document.getElementById('video-container').style.display = 'flex';
            peerConn = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
            localStream.getTracks().forEach(t => peerConn.addTrack(t, localStream));
            peerConn.ontrack = e => { document.getElementById('remoteVideo').srcObject = e.streams[0]; };
            peerConn.onicecandidate = e => { if(e.candidate) socket.emit('candidate', e.candidate); };
            await peerConn.setRemoteDescription(new RTCSessionDescription(pendingOffer));
            const ans = await peerConn.createAnswer(); await peerConn.setLocalDescription(ans); socket.emit('answer', ans);
        });
        document.getElementById('reject-call-btn').addEventListener('click', () => { document.getElementById('incoming-call-modal').style.display='none'; document.getElementById('ringtone').pause(); socket.emit('call_rejected'); });
        socket.on('call_rejected', () => { alert("Call Declined."); endCall(); });
        socket.on('answer', async a => { if(peerConn) await peerConn.setRemoteDescription(new RTCSessionDescription(a)); });
        socket.on('candidate', async c => { if(peerConn) try{await peerConn.addIceCandidate(new RTCIceCandidate(c));}catch(e){} });
        document.getElementById('end-call-btn').addEventListener('click', endCall);
        function endCall() { if(localStream) localStream.getTracks().forEach(t=>t.stop()); if(peerConn) peerConn.close(); document.getElementById('video-container').style.display='none'; document.getElementById('incoming-call-modal').style.display='none'; document.getElementById('ringtone').pause(); }
    </script>
</body>
</html>
